name: Google Maps parroquias
on:
  workflow_dispatch:
    inputs:
      consultas:
        description: "Archivo de consultas (una por línea, con #!#ID)"
        default: "consultas/prueba_bogota_20.txt"
      minutos:
        description: "Tiempo máximo de búsqueda en minutos"
        default: "15"
permissions:
  contents: write
jobs:
  maps:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Buscar en Google Maps
        run: |
          mkdir -p out
          timeout --signal=INT --kill-after=60 "${{ inputs.minutos }}m" docker run --rm -v "$PWD/${{ inputs.consultas }}:/queries.txt:ro" -v "$PWD/out:/out" \
            gosom/google-maps-scraper -input /queries.txt -results /out/results.csv \
            -depth 1 -lang es -c 4 -exit-on-inactivity 2m || echo "Búsqueda detenida por tiempo o cierre del contenedor"
          test -s out/results.csv || { echo "Sin resultados"; exit 1; }
          echo "Filas obtenidas: $(($(wc -l < out/results.csv) - 1))"
      - name: Cifrar resultados con la clave pública (solo César puede descifrarlos)
        run: |
          gpg --batch --import clave_publica.asc
          gpg --batch --yes --trust-model always -r 5D751E7574C429C98E111A11F3C4E9F5A9A151C8 -e -o resultados.csv.gpg out/results.csv
      - name: Guardar resultado cifrado en el repositorio
        run: |
          mkdir -p resultados
          NOMBRE="resultados/$(date -u +%Y%m%d-%H%M)-$(basename '${{ inputs.consultas }}' .txt).csv.gpg"
          mv resultados.csv.gpg "$NOMBRE"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add resultados && git commit -m "Resultado cifrado $NOMBRE" && git push
